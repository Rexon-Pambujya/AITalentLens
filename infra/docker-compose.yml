version: "3.9"

# `docker compose up --build` from the repo root brings up the entire
# stack (spec section 55). Service names double as hostnames on the
# default compose network, which is why .env.example points DATABASE_URL
# at `postgres` and `redis`, not `localhost`.

services:
  postgres:
    # pgvector/pgvector ships Postgres with the pgvector extension
    # pre-built - this is the same combination (Postgres 16 + pgvector)
    # verified directly in this build (see PROGRESS.md).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentlens
      POSTGRES_PASSWORD: talentlens
      POSTGRES_DB: talentlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentlens -d talentlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: talentlens
      MINIO_ROOT_PASSWORD: talentlens123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://talentlens:talentlens@postgres:5432/talentlens
      DATABASE_URL_SYNC: postgresql+psycopg2://talentlens:talentlens@postgres:5432/talentlens
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: talentlens
      AWS_SECRET_ACCESS_KEY: talentlens123
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
      LLM_PROVIDER: groq
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://talentlens:talentlens@postgres:5432/talentlens
      DATABASE_URL_SYNC: postgresql+psycopg2://talentlens:talentlens@postgres:5432/talentlens
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: talentlens
      AWS_SECRET_ACCESS_KEY: talentlens123
      LLM_PROVIDER: groq
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      # Overrides the backend image's HEALTHCHECK (curls :8000), which this
      # service never listens on since it's a Celery worker, not the API.
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Optional: web UI for inspecting Celery task status (spec section 55)
  flower:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - redis
    ports:
      - "5555:5555"
    command: celery -A app.workers.celery_app flower --port=5555
    profiles: ["tools"] # `docker compose --profile tools up` to include this

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
